# 파도멍 깨우기: Render 무료 서버가 15분 동안 아무도 없으면 잠드니, 10분마다 한 번씩 두드린다.
# (GitHub 예약 실행은 몇 분씩 늦어질 수 있다. /healthz 는 접속자 수·메타모아 집계에 잡히지 않는다.)
name: keepalive
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: ping padomeong
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 60 https://padomeong.onrender.com/healthz; then echo; exit 0; fi
            sleep 20
          done
          echo "깨우지 못했어요"; exit 0
